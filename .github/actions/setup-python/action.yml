name: Setup Python
description: Setup Python

inputs:
  python-version:
    description: Python version
    required: false
    default: "3.11"
  architecture:
    description: Python architecture
    required: false
    default: "x64"
  install-project:
    description: Install the project and dependency groups with uv
    required: false
    default: "true"
  uv-sync-arguments:
    description: Arguments passed to uv sync
    required: false
    default: "--all-groups --extra urwid --extra webui"
  install-event-loop:
    description: Install the platform-specific optional event loop
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install uv
      run: pipx install uv
      shell: bash

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        architecture: ${{ inputs.architecture }}
        cache: "pip"

    - name: Install project dependencies
      if: inputs.install-project == 'true' && inputs.install-event-loop != 'true'
      run: uv sync ${{ inputs.uv-sync-arguments }}
      shell: bash

    - name: Install project dependencies with optimized event loop
      if: inputs.install-project == 'true' && inputs.install-event-loop == 'true'
      run: >-
        uv sync
        ${{ inputs.uv-sync-arguments }}
        --extra ${{ runner.os == 'Windows' && 'winloop' || 'uvloop' }}
      shell: bash
